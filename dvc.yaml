# See README.md for instructions to run stages

# https://doc.dvc.org/user-guide/project-structure/dvcyaml-files#matrix-stages

# Data already imported via:
#     dvc import --out ./data/SKAB https://github.com/waico/SKAB.git ./data
# To pull latest data, run:
#     dvc update data/SKAB.dvc


stages:
  # ANOMALY DETECTION (AD) STAGE
  run_anomaly_detection:
    foreach:
      - contamination: None
      - contamination: 0.1
      - contamination: 0.2
      - contamination: 0.3
      - contamination: 0.4
    do:
      desc: "Anomaly detection on SKAB datasets (contamination: ${item.contamination})"
      cmd: python -m ml.ad --contamination ${item.contamination}
      deps:
        - src/ml/ad/__main__.py
        - src/ml/ad/anomaly_detection.py
        - src/ml/ad/training.py
        - data/SKAB
      outs:
        - results/ad/contamination_${item.contamination}/all_metadata.json

  # SOURCE CODE ANALYSIS (SCA) STAGES
  prepare_repositories:
    desc: "Prepare repositories for source code analysis"
    cmd: python src/ml/sca/repo.py
    deps:
      - src/ml/__init__.py
      - src/ml/sca/repo.py
    outs:
      - results/sca/git_analysis/1_ALL_LIBRARIES.csv

  run_source_code_analysis:
    desc: "Run source code analysis on the project"
    cmd: python -m ml.sca repositories results
    deps:
      - src/ml/__init__.py
      - src/ml/sca/__init__.py
      - src/ml/sca/__main__.py
      - src/ml/sca/analysis.py
      - src/ml/sca/repo.py
      - src/ml/sca/reporting.py
      - results/sca/git_analysis/1_ALL_LIBRARIES.csv
    outs:
      - results/sca/SUMMARY/T_summary.csv
